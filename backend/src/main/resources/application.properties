# ==============================================================================
# DRISHTI BACKEND - APPLICATION CONFIGURATION
# ==============================================================================

# Application Metadata
spring.application.name=drishti

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb+srv://sreenilayreddybackup_db_user:46KsmzmR6c32c85B@cluster0.wwbgidw.mongodb.net/drishti_db?retryWrites=true&w=majority&appName=Cluster0}}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
# IMPORTANT: In production, supply a strong 256-bit+ secret via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:drishti_production_grade_jwt_secret_key_minimum_256_bits_required_here!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Comma-separated list of allowed frontend origins / patterns)
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

# Bootstrap Administrator Configuration
# Set BOOTSTRAP_ADMIN_ENABLED=true and provide email & password to automatically seed initial admin
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@drishti.com}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:password123}
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:System Administrator}

# Spring Boot Actuator Configuration (Minimal exposure for security)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Proctoring & AI Telemetry Configuration
drishti.proctoring.rate-limit.heartbeat.capacity=12
drishti.proctoring.rate-limit.heartbeat.refill-per-minute=6.0
drishti.proctoring.rate-limit.events.capacity=30
drishti.proctoring.rate-limit.events.refill-per-minute=30.0
drishti.proctoring.heartbeat.stale-threshold-seconds=45

# Logging Configuration
logging.level.root=INFO
logging.level.com.drishti=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
