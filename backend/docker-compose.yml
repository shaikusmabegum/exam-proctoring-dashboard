version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: drishti-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: drishti_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - drishti-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/drishti_db
      - JWT_SECRET=4c8a91f2e6b7d3a0c5e8f1b4a7d0e3f6a9b2c5d8e1f4a7b0c3d6e9f2a5b8c1d4
      - JWT_EXPIRATION_MS=86400000
      - SPRING_PROFILES_ACTIVE=prod
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=when_authorized
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - drishti-net

volumes:
  mongodb_data:
    driver: local

networks:
  drishti-net:
    driver: bridge
